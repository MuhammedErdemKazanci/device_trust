name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  analyze_test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      
      - name: Flutter version
        run: flutter --version
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Analyze code
        run: flutter analyze
      
      - name: Run tests
        run: flutter test

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Example pub get
        run: cd example && flutter pub get

      - name: Analyze example
        run: cd example && flutter analyze

      - name: Test example
        run: cd example && flutter test
      
      - name: Validate publish
        run: flutter pub publish --dry-run

  android_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android example
        run: |
          cd example
          set -o pipefail
          flutter build apk --debug 2>&1 | tee android-build.log

      - name: Verify plugin does not apply KGP
        run: |
          if grep -Fq "plugins that apply Kotlin Gradle Plugin (KGP): device_trust" example/android-build.log; then
            echo "device_trust still applies the Kotlin Gradle Plugin"
            exit 1
          fi

      - name: Run Android plugin unit tests and lint
        run: cd example/android && ./gradlew :device_trust:testDebugUnitTest :device_trust:lintDebug --console=plain

  android_api_24_integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration test on Android API 24
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86_64
          profile: Nexus 6
          script: cd example && flutter test integration_test/plugin_integration_test.dart -d emulator-5554

  ios_pod_lint:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      
      - name: Install CocoaPods
        run: sudo gem install cocoapods --no-document

      - name: CocoaPods version
        run: pod --version

      - name: Update Specs repo
        run: pod repo update

      - name: Pod lib lint
        run: cd ios && pod lib lint --allow-warnings

      - name: Disable SPM for CocoaPods build
        run: flutter config --no-enable-swift-package-manager

      - name: CocoaPods example build (iOS simulator)
        run: cd example && flutter build ios --simulator --no-codesign

  ios_spm_build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Install dependencies
        run: cd example && flutter pub get

      - name: SPM example build (iOS simulator)
        run: cd example && flutter build ios --simulator --no-codesign
